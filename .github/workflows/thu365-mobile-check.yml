name: THU365 native checks

on:
  pull_request:
    paths:
      - "apps/thu365-mobile/**"
      - ".github/workflows/thu365-mobile-check.yml"
  push:
    branches:
      - "**"
    paths:
      - "apps/thu365-mobile/**"
      - ".github/workflows/thu365-mobile-check.yml"

permissions:
  contents: read

concurrency:
  group: thu365-native-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/thu365-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native app icon from the official THU365 logo
        run: |
          mkdir -p assets
          npm install --no-save --no-audit --no-fund sharp
          node -e "require('sharp')('../../artifacts/mockup-sandbox/public/thu365/app-icon.svg').resize(1024,1024).png().toFile('assets/icon.png').then(()=>console.log('Generated assets/icon.png')).catch(error=>{console.error(error);process.exit(1)})"
      - name: Verify Expo SDK package compatibility
        run: npx expo install --check
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Expo project diagnostics
        run: npx expo-doctor
