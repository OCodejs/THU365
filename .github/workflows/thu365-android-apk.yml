name: THU365 Android test APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/thu365-mobile/**"
      - ".github/workflows/thu365-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: thu365-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build installable Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/thu365-mobile
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native app icon from the official THU365 logo
        run: |
          mkdir -p assets
          npm install --no-save --no-audit --no-fund sharp
          node -e "require('sharp')('../../artifacts/mockup-sandbox/public/thu365/app-icon.svg').resize(1024,1024).png().toFile('assets/icon.png').then(()=>console.log('Generated assets/icon.png')).catch(error=>{console.error(error);process.exit(1)})"

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build debug APK
        working-directory: apps/thu365-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: THU365-Android-test-${{ github.run_number }}
          path: apps/thu365-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
