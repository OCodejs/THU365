name: THU365 prototype checks

on:
  pull_request:
    paths:
      - "artifacts/mockup-sandbox/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/thu365-prototype-check.yml"
  push:
    branches:
      - "feat/native-camera-permissions"
    paths:
      - "artifacts/mockup-sandbox/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/thu365-prototype-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript checks
        run: pnpm --filter @workspace/mockup-sandbox run typecheck
      - name: Build prototype
        run: pnpm --filter @workspace/mockup-sandbox run build
